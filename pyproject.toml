[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palace"
version = "0.1.0"
description = "Palace — every device of the house on a map and in cards; a standalone panel for Home Assistant"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
palace = "palace.main:cli"

[tool.setuptools.packages.find]
include = ["palace*"]

[tool.setuptools.package-data]
palace = ["web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # Cyrillic and typographic characters in strings and comments are on purpose

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["SIM905"]   # icon lists as whitespace-separated words read better than list literals
