# cp .env.example .env   — вписать HA_URL и HA_TOKEN
# docker compose up -d --build
# страница: http://<адрес>:8080 (порт — PALACE_PORT в .env)

services:
  palace:
    build: .
    image: palace:latest
    container_name: palace
    env_file: .env
    ports:
      - "${PALACE_PORT:-8080}:8080"
    # HA на этом же хосте: HA_URL=http://host.docker.internal:8123
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/data            # palace.yaml — расстановка карты, порядок, иконки, скрытое
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

volumes:
  data:
